name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Both Dockerfiles' base image.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Catches a syntax error in a module the tests never import.
      - name: Check every server module parses
        run: |
          for f in $(git ls-files 'server/src/*.js'); do
            node --check "$f"
          done

      - name: Test server
        run: npm test

      - name: Typecheck web
        run: npm run typecheck

      - name: Build web
        run: npm run build

      - name: Validate compose files
        run: |
          # Both read env_file .env files that only exist on a real host, and
          # the prod file refuses to interpolate without its required variables,
          # so CI supplies placeholders - this checks the files' shape, not the values.
          touch .env server/.env
          MINIAPP_SERVER_IMAGE=ci MINIAPP_WEB_IMAGE=ci BOT_TOKEN=ci PUBLIC_URL=https://ci \
            docker compose -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.yml config -q

  image:
    name: Build & Push ${{ matrix.part }} image
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        part: [server, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests only build, to verify the Dockerfiles still work.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}/${{ matrix.part }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Both images build from the repository root, where the npm workspace and
      # its lockfile live. VITE_BOT_USERNAME is baked into the web bundle (the
      # "open in Telegram" link shown outside Telegram); the server ignores it.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.part }}/Dockerfile
          build-args: |
            VITE_BOT_USERNAME=${{ vars.BOT_USERNAME }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.part }}
          cache-to: type=gha,mode=max,scope=${{ matrix.part }}

  # Announce merges to main in Telegram. Requires the repository secrets
  # TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID_CICD; with either unset the job runs
  # and quietly does nothing.
  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [test, image]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # The commit subject and author are attacker-controlled text: they reach
      # bash through the environment, never through ${{ }} interpolation.
      - name: Compose message
        id: msg
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          TEST_RESULT: ${{ needs.test.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          set -euo pipefail

          escape() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }

          subject=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | escape)
          author=$(printf '%s' "$COMMIT_AUTHOR" | escape)
          short_sha=$(printf '%s' "${{ github.sha }}" | cut -c1-7)
          repo_url="${{ github.server_url }}/${{ github.repository }}"

          if [ "$TEST_RESULT" = "success" ] && [ "$IMAGE_RESULT" = "success" ]; then
            headline="✅ <b>marketbot-miniapp merged to main</b>"
            status="CI green - server and web images pushed as <code>latest</code>"
          else
            headline="❌ <b>marketbot-miniapp merged to main - CI failed</b>"
            status="test: <code>${TEST_RESULT}</code> · images: <code>${IMAGE_RESULT}</code>"
          fi

          {
            echo "text<<TELEGRAM_EOF"
            echo "${headline}"
            echo ""
            echo "<code>${short_sha}</code> ${subject}"
            echo "👤 ${author}"
            echo "🔧 ${status}"
            echo ""
            echo "<a href=\"${repo_url}/commit/${{ github.sha }}\">commit</a> · <a href=\"${repo_url}/actions/runs/${{ github.run_id }}\">CI run</a>"
            echo "TELEGRAM_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID_CICD }}
          message: ${{ steps.msg.outputs.text }}
