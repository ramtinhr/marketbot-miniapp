name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Both Dockerfiles' base image.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Catches a syntax error in a module the tests never import.
      - name: Check every server module parses
        run: |
          for f in $(git ls-files 'server/src/*.js'); do
            node --check "$f"
          done

      - name: Test server
        run: npm test

      - name: Typecheck web
        run: npm run typecheck

      - name: Build web
        run: npm run build

      - name: Validate deployment scripts
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s deploy -p 'test_*.py' -v

      - name: Validate compose files
        run: |
          # Both read env_file .env files that only exist on a real host, and
          # the prod file refuses to interpolate without its required variables,
          # so CI supplies placeholders - this checks the files' shape, not the values.
          touch .env server/.env
          MINIAPP_SERVER_IMAGE=ci MINIAPP_WEB_IMAGE=ci BOT_TOKEN=ci PUBLIC_URL=https://ci \
            docker compose -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.yml config -q

  image:
    name: Build and verify container
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        part: [server, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.part }}" >> "$GITHUB_OUTPUT"
      - name: Build once
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.part }}/Dockerfile
          load: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.part }}
          cache-to: type=gha,mode=max,scope=${{ matrix.part }}
          build-args: |
            VITE_BOT_USERNAME=${{ vars.BOT_USERNAME }}
      - name: Verify production image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          if [ "$PART" = server ]; then
            docker run --rm --entrypoint node "$IMAGE" --check src/server.js
            exit 0
          fi
          trap 'docker logs web-smoke; docker rm -f web-smoke' EXIT
          docker run -d --name web-smoke -p 127.0.0.1:3301:80 "$IMAGE"
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 5 http://127.0.0.1:3301/healthz >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:latest"

  # Announce merges to main in Telegram. Requires the repository secrets
  # TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID_CICD; with either unset the job runs
  # and quietly does nothing.
  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [test, image]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The commit subject and author are attacker-controlled text: they reach
      # bash through the environment, never through ${{ }} interpolation.
      - name: Compose message
        id: msg
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          TEST_RESULT: ${{ needs.test.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          set -euo pipefail

          escape() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }

          subject=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | escape)
          author=$(printf '%s' "$COMMIT_AUTHOR" | escape)
          short_sha=$(printf '%s' "${{ github.sha }}" | cut -c1-7)
          repo_url="${{ github.server_url }}/${{ github.repository }}"

          if [ "$TEST_RESULT" = "success" ] && [ "$IMAGE_RESULT" = "success" ]; then
            headline="✅ <b>marketbot-miniapp merged to main</b>"
            status="CI green - server and web images pushed as <code>latest</code>"
          else
            headline="❌ <b>marketbot-miniapp merged to main - CI failed</b>"
            status="test: <code>${TEST_RESULT}</code> · images: <code>${IMAGE_RESULT}</code>"
          fi

          {
            echo "text<<TELEGRAM_EOF"
            echo "${headline}"
            echo ""
            echo "<code>${short_sha}</code> ${subject}"
            echo "👤 ${author}"
            echo "🔧 ${status}"
            echo ""
            echo "<a href=\"${repo_url}/commit/${{ github.sha }}\">commit</a> · <a href=\"${repo_url}/actions/runs/${{ github.run_id }}\">CI run</a>"
            echo "TELEGRAM_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID_CICD }}
          message: ${{ steps.msg.outputs.text }}
