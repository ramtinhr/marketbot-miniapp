name: Deploy

# Manual only, like the bot's, the API's and the dashboard's deploys: the mini
# app moves real users' money.
#
# Deploys to the same host as the bot, the exchange engine and marketbot-api,
# and relies on them: the bot's Postgres and Kafka, the engine's "exchange"
# schema and topics, and the API's nginx serving MINIAPP_DOMAIN over HTTPS
# (MINIAPP_DOMAIN and MINIAPP_PORT in its API_ENV). Deploy those first.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. latest, main, or a full commit sha)"
        required: true
        default: "latest"

concurrency:
  group: deploy-production-miniapp
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image references
        id: img
        run: |
          echo "server=${IMAGE,,}/server:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          echo "web=${IMAGE,,}/web:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"

      # The server cannot reach ghcr.io, so the runner does all registry work
      # and the images travel to the server over SSH.
      - name: Pull images on the runner
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull "${{ steps.img.outputs.server }}"
          docker pull "${{ steps.img.outputs.web }}"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<CONF
          Host target
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            Port ${{ vars.SSH_PORT || '22' }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
          CONF

      # MINIAPP_ENV holds the server's .env (see server/.env.example): DB_*
      # matching the bot's, BOT_TOKEN, PUBLIC_URL (https://MINIAPP_DOMAIN),
      # BOT_USERNAME, KAVENEGAR_*, ZARINPAL_MERCHANT_ID, and optionally
      # SERVER_PORT and WEB_PORT when 8090 and 8082 are taken.
      - name: Build .env for the server
        env:
          MINIAPP_ENV: ${{ secrets.MINIAPP_ENV }}
        run: |
          umask 077
          printf '%s\n' "$MINIAPP_ENV" > env.out
          # The deploy chooses the images; they are not part of the stored secret.
          sed -i -e '/^MINIAPP_SERVER_IMAGE=/d' -e '/^MINIAPP_WEB_IMAGE=/d' env.out
          echo "MINIAPP_SERVER_IMAGE=${{ steps.img.outputs.server }}" >> env.out
          echo "MINIAPP_WEB_IMAGE=${{ steps.img.outputs.web }}" >> env.out

      - name: Ship compose file and .env
        run: |
          DEPLOY_PATH="${{ vars.MINIAPP_DEPLOY_PATH }}"
          ssh target "mkdir -p '$DEPLOY_PATH'"
          scp docker-compose.prod.yml target:"$DEPLOY_PATH/docker-compose.yml"
          scp env.out target:"$DEPLOY_PATH/.env"
          ssh target "chmod 600 '$DEPLOY_PATH/.env'"

      # Shipped every time: the tags are reused across builds, so "already
      # present" says nothing about whether they are current.
      - name: Ship images to the server
        run: |
          docker save "${{ steps.img.outputs.server }}" "${{ steps.img.outputs.web }}" \
            | gzip -1 \
            | ssh target "gunzip | docker load"

      - name: Start the mini app
        run: |
          ssh target bash -eu <<'REMOTE'
            cd "${{ vars.MINIAPP_DEPLOY_PATH }}"
            docker compose up -d --remove-orphans
            docker compose ps
          REMOTE

      # /health/ready fails when Postgres is unreachable, the engine has not
      # migrated the exchange schema, or Kafka is down - the usual ways this
      # deploy goes wrong. /healthz and /api/v1/market/symbols check the web
      # container and its proxy to the server.
      - name: Health check
        run: |
          ssh target bash -eu <<'REMOTE'
            ENV_FILE="${{ vars.MINIAPP_DEPLOY_PATH }}/.env"
            SERVER_PORT=$(grep -E '^SERVER_PORT=' "$ENV_FILE" | cut -d= -f2 || true)
            WEB_PORT=$(grep -E '^WEB_PORT=' "$ENV_FILE" | cut -d= -f2 || true)
            SERVER_PORT="${SERVER_PORT:-8090}"
            WEB_PORT="${WEB_PORT:-8082}"
            for i in $(seq 1 30); do
              if body=$(curl -fsS "http://127.0.0.1:$SERVER_PORT/health/ready") \
                && curl -fsS "http://127.0.0.1:$WEB_PORT/healthz" >/dev/null \
                && curl -fsS "http://127.0.0.1:$WEB_PORT/api/v1/market/symbols" >/dev/null; then
                echo "server ready on $SERVER_PORT ($body), web up on $WEB_PORT"
                exit 0
              fi
              sleep 2
            done
            echo "mini app did not become ready - last answers and recent logs:"
            curl -sS "http://127.0.0.1:$SERVER_PORT/health/ready" || true
            curl -sS "http://127.0.0.1:$WEB_PORT/healthz" || true
            docker logs --tail 100 marketbot-miniapp-server || true
            docker logs --tail 30 marketbot-miniapp-web || true
            exit 1
          REMOTE

      - name: Report
        if: always()
        run: |
          {
            echo "### Mini app deploy ${{ job.status }}"
            echo ""
            echo "- Server image: \`${{ steps.img.outputs.server }}\`"
            echo "- Web image: \`${{ steps.img.outputs.web }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Requires the repository secrets TELEGRAM_BOT_TOKEN and
      # TELEGRAM_CHAT_ID_CICD; with either unset these steps quietly do nothing.
      - name: Compose Telegram message
        id: notify_msg
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          repo_url="${{ github.server_url }}/${{ github.repository }}"
          short_sha=$(printf '%s' "${{ github.sha }}" | cut -c1-7)
          tag=$(printf '%s' "$IMAGE_TAG" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')

          case "$JOB_STATUS" in
            success) headline="🚀 <b>Mini app deploy succeeded</b>" ;;
            cancelled) headline="⚪️ <b>Mini app deploy cancelled</b>" ;;
            *) headline="🔥 <b>Mini app deploy FAILED</b>" ;;
          esac

          {
            echo "text<<TELEGRAM_EOF"
            echo "${headline}"
            echo ""
            echo "📦 server + web <code>${tag}</code>"
            echo "🔖 <code>${short_sha}</code>"
            echo "👤 ${{ github.actor }}"
            echo ""
            echo "<a href=\"${repo_url}/actions/runs/${{ github.run_id }}\">deploy run</a>"
            echo "TELEGRAM_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID_CICD }}
          message: ${{ steps.notify_msg.outputs.text }}

      - name: Clean up
        if: always()
        run: rm -f env.out ~/.ssh/id_deploy
